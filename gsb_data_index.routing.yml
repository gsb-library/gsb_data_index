gsb_data_index.settings:
  path: '/admin/config/gsb-data-index'
  defaults:
    _form: '\Drupal\gsb_data_index\Form\GSBDataIndexSettingsForm'
    _title: 'GSB Data Index Settings'
  requirements:
    _permission: 'administer gsb data index settings'

gsb_data_index.algolia_secured_key:
  path: '/api/algolia/secured-key'
  defaults:
    _controller: '\Drupal\gsb_data_index\Controller\AlgoliaSecuredKeyController::getKey'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE