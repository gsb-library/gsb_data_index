services:
  gsb_data_index.algolia_secured_key_generator:
    class: Drupal\gsb_data_index\AlgoliaSecuredKeyGenerator
    arguments: [ '@config.factory' ]
  gsb_data_index.feeds_presave_subscriber:
    class: Drupal\gsb_data_index\EventSubscriber\FeedsPresaveSubscriber
    tags:
      - { name: event_subscriber }
  gsb_data_index.event_subscriber:
    class: Drupal\gsb_data_index\EventSubscriber\SAMLRolesEventSubscriber
    arguments: [ '@config.factory', '@logger.channel.samlauth', '@entity_type.manager' ]
    tags:
      - { name: event_subscriber }